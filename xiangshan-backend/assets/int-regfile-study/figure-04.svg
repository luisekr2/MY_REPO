<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 305" role="img" aria-labelledby="rf-title-4" width="1120" height="305" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rf-title-4">읽기 충돌을 port와 bank의 두 좌표로 판정</title><defs><marker id="rf-arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><g data-box="true"><rect x="8" y="18" width="356" height="53" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="186.0" y="52.5" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">같은 bank · 다른 port</text></g><text x="186" y="123" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ALU3 src0: R6 / B1</text><text x="186" y="169" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ALU3 src1: R7 / B1</text><text x="186" y="235" font-size="21" fill="#157b85" font-weight="700" text-anchor="middle">서로 다른 cell → 병렬 가능</text><g data-box="true"><rect x="382" y="18" width="356" height="53" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="560.0" y="52.5" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">같은 port · 다른 bank</text></g><text x="560" y="123" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ALU3 src1: R7 / B2</text><text x="560" y="169" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">LDU0 src0: R7 / B1</text><text x="560" y="235" font-size="21" fill="#157b85" font-weight="700" text-anchor="middle">서로 다른 cell → 병렬 가능</text><g data-box="true"><rect x="756" y="18" width="356" height="53" rx="9" fill="#fff0e9" stroke="#bed1d7"/><text x="934.0" y="52.5" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">같은 port · 같은 bank</text></g><text x="934" y="123" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ALU3 src1: R7 / B1</text><text x="934" y="169" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">LDU0 src0: R7 / B1</text><text x="934" y="235" font-size="21" fill="#b45635" font-weight="700" text-anchor="middle">같은 cell → 한 요청만 승리</text><text x="560" y="285" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">R = logical read port, B = bank · row가 달라도 같은 cell이면 경쟁</text></svg>
