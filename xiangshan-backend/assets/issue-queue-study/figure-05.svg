<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 285" role="img" aria-label="같은 port와 bank의 충돌이 IQ 재선택으로 돌아오는 경로" width="1120" height="285" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title>같은 port와 bank의 충돌이 IQ 재선택으로 돌아오는 경로</title><defs><marker id="arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="35" y="15" width="300" height="73" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="185.0" y="48" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">U: ALU3 src1</text><text x="185.0" y="80" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">p5 → bank 1</text><rect x="35" y="112" width="300" height="73" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="185.0" y="145" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">V: LDU0 src0</text><text x="185.0" y="177" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">p9 → bank 1</text><rect x="430" y="54" width="290" height="95" rx="9" fill="#fff3dd" stroke="#bed1d7"/><text x="575.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">read port 7 / bank 1</text><text x="575.0" y="119" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">동시에 한 요청만 수락</text><path d="M345 52 H370 V86 H420" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#arrow-4)"/><path d="M345 148 H370 V115 H420" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#arrow-4)"/><path d="M730 100 H790" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#arrow-4)"/><rect x="805" y="54" width="300" height="95" rx="9" fill="#fff0e9" stroke="#bed1d7"/><text x="955.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">V 승리로 가정</text><text x="955.0" y="119" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">U의 OG0 시도 실패</text><path d="M950 160 V235 H15 V52 H25" fill="none" stroke="#b45635" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-4)"/><text x="590" y="270" font-size="25" fill="#b45635" font-weight="700" text-anchor="middle">U의 IQ entry 보존 → issued 해제 → 다시 선택</text></svg>
