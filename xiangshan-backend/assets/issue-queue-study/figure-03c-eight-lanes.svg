<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50657b"/></marker></defs><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#172c41}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style><rect width="1200" height="1250" fill="white"/>
<text x="30" y="40" class="title">그림 3-0 · 8개 lane은 후보 목록을 보고 어떻게 IQ로 나뉠까?</text>
<text x="30" y="72" class="small">설명용 선택 상태 · 아래 후보 순서는 가정이며 실제 파형이 아니다. 기준: f85a1f7</text>
<text x="30" y="112" class="head">① 갈 수 있는 IQ는 고정 · 부하에 따라 목록의 순서가 갱신된다</text>
<rect x="30" y="132" width="700" height="115" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<rect x="750" y="132" width="420" height="115" rx="8" fill="#fff2e2" stroke="#aabac9"/>
<text x="48" y="162" class="head">ALU 후보 목록 · ALU 명령끼리 순번 계산</text>
<text x="48" y="195" class="body">목록 위치</text>
<text x="48" y="226" class="body">선택할 IQ</text>
<text x="180" y="195" class="body">0</text>
<text x="170" y="226" class="body">IQ0</text>
<text x="265" y="195" class="body">1</text>
<text x="255" y="226" class="body">IQ4</text>
<text x="350" y="195" class="body">2</text>
<text x="340" y="226" class="body">IQ2</text>
<text x="435" y="195" class="body">3</text>
<text x="425" y="226" class="body">IQ1</text>
<text x="520" y="195" class="body">4</text>
<text x="510" y="226" class="body">IQ5</text>
<text x="605" y="195" class="body">5</text>
<text x="595" y="226" class="body">IQ3</text>
<text x="768" y="162" class="head">BJU 후보 목록 · 별도 순번 계산</text>
<text x="768" y="195" class="body">목록 위치</text>
<text x="768" y="226" class="body">선택할 IQ</text>
<text x="900" y="195" class="body">0</text>
<text x="890" y="226" class="body">IQ0</text>
<text x="985" y="195" class="body">1</text>
<text x="975" y="226" class="body">IQ2</text>
<text x="1070" y="195" class="body">2</text>
<text x="1060" y="226" class="body">IQ1</text>
<path d="M380 247 L380 280" stroke="#50657b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M960 247 L960 280" stroke="#50657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="310" class="head">② 모든 lane이 병렬로 선택 · ALU 첫 명령과 BJU 첫 명령은 같은 IQ를 고를 수 있다</text>
<rect x="30" y="330" width="110" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="42" y="360" class="small">입력 자리</text>
<rect x="140" y="330" width="160" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="152" y="360" class="small">명령</text>
<rect x="300" y="330" width="220" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="312" y="360" class="small">그룹 내 순번</text>
<rect x="520" y="330" width="200" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="532" y="360" class="small">선택한 목적지</text>
<rect x="720" y="330" width="220" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="732" y="360" class="small">IQ0 누적 요청</text>
<rect x="940" y="330" width="230" height="46" rx="8" fill="#dfe8f1" stroke="#aabac9"/>
<text x="952" y="360" class="small">IQ2 누적 요청</text>
<rect x="30" y="380" width="1140" height="40" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<text x="42" y="407" class="body">lane 0</text>
<text x="152" y="407" class="body">ADD · ALU</text>
<text x="312" y="407" class="body">ALU 0번째</text>
<text x="532" y="407" class="body">IQ0</text>
<text x="732" y="407" class="body">1</text>
<text x="952" y="407" class="body">0</text>
<rect x="30" y="423" width="1140" height="40" rx="8" fill="#fff2e2" stroke="#aabac9"/>
<text x="42" y="450" class="body">lane 1</text>
<text x="152" y="450" class="body">BEQ · BJU</text>
<text x="312" y="450" class="body">BJU 0번째</text>
<text x="532" y="450" class="body">IQ0</text>
<text x="732" y="450" class="body">2</text>
<text x="952" y="450" class="body">0</text>
<rect x="30" y="466" width="1140" height="40" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<text x="42" y="493" class="body">lane 2</text>
<text x="152" y="493" class="body">SUB · ALU</text>
<text x="312" y="493" class="body">ALU 1번째</text>
<text x="532" y="493" class="body">IQ4</text>
<text x="732" y="493" class="body">2</text>
<text x="952" y="493" class="body">0</text>
<rect x="30" y="509" width="1140" height="40" rx="8" fill="#fff2e2" stroke="#aabac9"/>
<text x="42" y="536" class="body">lane 3</text>
<text x="152" y="536" class="body">BNE · BJU</text>
<text x="312" y="536" class="body">BJU 1번째</text>
<text x="532" y="536" class="body">IQ2</text>
<text x="732" y="536" class="body">2</text>
<text x="952" y="536" class="body">1</text>
<rect x="30" y="552" width="1140" height="40" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<text x="42" y="579" class="body">lane 4</text>
<text x="152" y="579" class="body">XOR · ALU</text>
<text x="312" y="579" class="body">ALU 2번째</text>
<text x="532" y="579" class="body">IQ2</text>
<text x="732" y="579" class="body">2</text>
<text x="952" y="579" class="body">2</text>
<rect x="30" y="595" width="1140" height="40" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<text x="42" y="622" class="body">lane 5</text>
<text x="152" y="622" class="body">AND · ALU</text>
<text x="312" y="622" class="body">ALU 3번째</text>
<text x="532" y="622" class="body">IQ1</text>
<text x="732" y="622" class="body">2</text>
<text x="952" y="622" class="body">2</text>
<rect x="30" y="638" width="1140" height="40" rx="8" fill="#fff2e2" stroke="#aabac9"/>
<text x="42" y="665" class="body">lane 6</text>
<text x="152" y="665" class="body">BLT · BJU</text>
<text x="312" y="665" class="body">BJU 2번째</text>
<text x="532" y="665" class="body">IQ1</text>
<text x="732" y="665" class="body">2</text>
<text x="952" y="665" class="body">2</text>
<rect x="30" y="681" width="1140" height="40" rx="8" fill="#eaf2ff" stroke="#aabac9"/>
<text x="42" y="708" class="body">lane 7</text>
<text x="152" y="708" class="body">OR · ALU</text>
<text x="312" y="708" class="body">ALU 4번째</text>
<text x="532" y="708" class="body">IQ5</text>
<text x="732" y="708" class="body">2</text>
<text x="952" y="708" class="body">2</text>
<text x="30" y="749" class="small">누적 PopCount = lane 0부터 해당 lane까지 같은 IQ를 선택한 수. 실제 enqueue 완료 횟수가 아니다.</text>
<text x="30" y="778" class="small">예: IQ0 요청은 lane 0에서 1개, lane 1에서 2개가 되고, 나머지 lane에서는 2개로 유지된다.</text>
<path d="M600 790 L600 819" stroke="#50657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="847" class="head">③ 선택 결과를 IQ 입구에 연결한다 · 여기까지는 목적지와 입구 배정</text>
<rect x="30" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="42" y="895" class="head">IQ0</text>
<text x="42" y="926" class="small">입구 0 ← lane 0</text>
<text x="42" y="952" class="small">입구 1 ← lane 1</text>
<rect x="222" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="234" y="895" class="head">IQ1</text>
<text x="234" y="926" class="small">입구 0 ← lane 5</text>
<text x="234" y="952" class="small">입구 1 ← lane 6</text>
<rect x="414" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="426" y="895" class="head">IQ2</text>
<text x="426" y="926" class="small">입구 0 ← lane 3</text>
<text x="426" y="952" class="small">입구 1 ← lane 4</text>
<rect x="606" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="618" y="895" class="head">IQ3</text>
<text x="618" y="926" class="small">요청 없음</text>
<text x="618" y="952" class="small"></text>
<rect x="798" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="810" y="895" class="head">IQ4</text>
<text x="810" y="926" class="small">입구 0 ← lane 2</text>
<text x="810" y="952" class="small"></text>
<rect x="990" y="867" width="180" height="110" rx="8" fill="#f2f6fa" stroke="#aabac9"/>
<text x="1002" y="895" class="head">IQ5</text>
<text x="1002" y="926" class="small">입구 0 ← lane 7</text>
<text x="1002" y="952" class="small"></text>
<path d="M600 977 L600 1009" stroke="#50657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="1038" class="head">④ 실제 enqueue는 IQ ready·입구 수와 ROB·LSQ·순서 조건까지 확인한 뒤 결정</text>
<rect x="30" y="1057" width="556" height="107" rx="8" fill="#e8f6ee" stroke="#aabac9"/>
<rect x="610" y="1057" width="560" height="107" rx="8" fill="#fff1e4" stroke="#aabac9"/>
<text x="46" y="1086" class="head">모든 조건이 통과하면</text>
<text x="46" y="1116" class="body">lane 0–7 모두 같은 사이클에 enqueue 가능</text>
<text x="46" y="1144" class="small">가정: 표시한 IQ 입구 모두 수용 가능</text>
<text x="626" y="1086" class="head">IQ2.ready=0이면 (나머지 조건은 통과)</text>
<text x="626" y="1116" class="body">lane 0–2만 전달 · lane 3–7은 대기</text>
<text x="626" y="1144" class="small">앞선 IQ2 요청의 차단이 뒤쪽 lane에도 전파</text>
<text x="30" y="1201" class="small">대기 중에는 목적지를 다시 계산할 수 있다. 현재 ready를 보고 같은 사이클에 다른 IQ로 즉시 우회하지 않는다.</text>
<text x="30" y="1230" class="small">그룹별 순번: IQ에 분산하기 위한 수 / IQ별 누적 수: 입구 배정과 수용량 검사를 위한 수</text></svg>