<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 335" role="img" aria-labelledby="rf-title-1" width="1120" height="335" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rf-title-1">상위 비트 연속 bank와 하위 비트 interleave bank 비교</title><defs><marker id="rf-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><text x="280" y="35" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">이전: 상위 2-bit가 bank</text><text x="840" y="35" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">현재: 하위 2-bit가 bank</text><g data-box="true"><rect x="12" y="47" width="535" height="60" rx="9" fill="#fff0e9" stroke="#bed1d7"/><text x="279.5" y="85.0" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">psrc[7:6] = bank | psrc[5:0] = row</text></g><g data-box="true"><rect x="572" y="47" width="535" height="60" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="839.5" y="85.0" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">psrc[7:2] = row | psrc[1:0] = bank</text></g><text x="280" y="145" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B0: p0–63 · 64 rows</text><text x="840" y="145" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B0: p0,4,…,220 · 56 rows</text><text x="280" y="185" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B1: p64–127 · 64 rows</text><text x="840" y="185" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B1: p1,5,…,221 · 56 rows</text><text x="280" y="225" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B2: p128–191 · 64 rows</text><text x="840" y="225" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B2: p2,6,…,222 · 56 rows</text><text x="280" y="265" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B3: p192–223 · 32 rows</text><text x="840" y="265" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">B3: p3,7,…,223 · 56 rows</text><text x="560" y="312" font-size="23" fill="#157b85" font-weight="700" text-anchor="middle">같은 p29: 이전 (Bank 0, row 29) → 현재 (Bank 1, row 7)</text></svg>
