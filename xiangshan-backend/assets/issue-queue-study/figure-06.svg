<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 285" role="img" aria-label="하나의 IQ가 막힐 때 뒤쪽 명령까지 기다리는 이유" width="1120" height="285" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title>하나의 IQ가 막힐 때 뒤쪽 명령까지 기다리는 이유</title><defs><marker id="arrow-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><text x="10" y="28" font-size="23" fill="#16394a" font-weight="400" text-anchor="start">앞에서부터 수용 조건을 누적 검사</text><text x="1110" y="28" font-size="21" fill="#687d88" font-weight="400" text-anchor="end">가정: IQ0 ready=0, 나머지 ready=1</text><rect x="10" y="58" width="260" height="96" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="140.0" y="91" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">A0 → IQ4</text><text x="140.0" y="123" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">수락</text><text x="140" y="201" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">진행</text><rect x="290" y="58" width="260" height="96" rx="9" fill="#fff0e9" stroke="#bed1d7"/><text x="420.0" y="91" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">A1 → IQ0</text><text x="420.0" y="123" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">미수용</text><text x="420" y="201" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">여기서 정지</text><rect x="570" y="58" width="260" height="96" rx="9" fill="#fff3dd" stroke="#bed1d7"/><text x="700.0" y="91" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">A2 → IQ5</text><text x="700.0" y="123" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">목적지는 여유</text><text x="700" y="201" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">앞 명령 때문에 대기</text><rect x="850" y="58" width="260" height="96" rx="9" fill="#fff3dd" stroke="#bed1d7"/><text x="980.0" y="91" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">A3 → IQ2</text><text x="980.0" y="123" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">목적지는 여유</text><text x="980" y="201" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">앞 명령 때문에 대기</text><text x="560" y="263" font-size="23" fill="#157b85" font-weight="700" text-anchor="middle">대기 명령은 다음 선택 갱신에서 재배치될 수 있음 · 해소 시점은 미정</text></svg>
