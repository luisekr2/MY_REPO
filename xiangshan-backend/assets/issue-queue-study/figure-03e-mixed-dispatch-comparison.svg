<path d="M692 1125 H1162" fill="none" stroke="#b45422" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="1200" width="1180" height="89" rx="8" fill="#fff4de" stroke="#a7b9ca"/>
<text x="48" y="1230" class="head">B와 C는 IQ별 총 요청 수가 같다. 하지만 첫 충돌이 lane 7 / lane 4라서 수용량이 7개 / 4개다.</text>
<text x="48" y="1264" class="small">C의 lane 5는 IQ4가 여유 있어도 막힌다. IQ0의 누적 요청 3개가 뒤쪽 lane의 차단 조건에도 남기 때문이다.</text>
<text x="30" y="1310" class="small">기준 f85a1f7 · 입구 수: Parameters.scala:345–367 · 누적 요청과 차단: Dispatch.scala:580–648</text></svg>