<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 305" role="img" aria-labelledby="be-title-4" width="1120" height="305" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="be-title-4">메모리 명령의 Backend MemBlock 왕복 경로</title><defs><marker id="be-arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="10" y="40" width="310" height="90" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="165.0" y="71" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">Backend</text><text x="165.0" y="102" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">발행·ROB/LSQ identity</text><rect x="460" y="15" width="650" height="60" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="785.0" y="53.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">Load 경로: 주소 → 메모리 접근 → 결과</text><rect x="460" y="110" width="650" height="60" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="785.0" y="148.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">Store 경로: STA 주소 + STD 데이터 → SQ</text><path d="M330 62 H390 V45 H450" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#be-arrow-4)"/><path d="M330 110 H390 V140 H450" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#be-arrow-4)"/><path d="M1000 180 V232 H165 V140" fill="none" stroke="#157b85" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#be-arrow-4)"/><text x="630" y="222" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">결과 / 완료 / wakeup / replay·cancel 피드백</text><text x="560" y="285" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">LSQ가 순서·준비·복구 상태를 관리 · 실제 cache 접근과 store 배출은 MemBlock 소관</text></svg>
