<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" role="img" aria-labelledby="rc-title-6" width="1120" height="310" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rc-title-6">store는 token 하나이며 STA STD의 완료 두 개를 기다림</title><defs><marker id="rc-arrow-6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="12" y="85" width="255" height="90" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="139.5" y="117" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">SD: C token 하나</text><text x="139.5" y="149" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">register dest = 0</text><path d="M277 111 H315 V64 H370" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-6)"/><path d="M277 150 H315 V209 H370" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-6)"/><rect x="380" y="20" width="330" height="88" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="545.0" y="52" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">STA: 주소 완료</text><text x="545.0" y="84" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ROB에 성공 WB 1개</text><rect x="380" y="165" width="330" height="88" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="545.0" y="197" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">STD: 데이터 완료</text><text x="545.0" y="229" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">ROB에 성공 WB 1개</text><path d="M720 64 H775 V111 H830" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-6)"/><path d="M720 209 H775 V150 H830" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-6)"/><rect x="840" y="85" width="265" height="90" rx="8" fill="#d9eeee" stroke="#bed1d7"/><text x="972.5" y="117" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">같은 slot counter</text><text x="972.5" y="149" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">2 → 1 → 0</text><text x="560" y="290" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">SQ의 addrValid/dataValid와 ROB WB는 별도 전달 경로다.</text></svg>
