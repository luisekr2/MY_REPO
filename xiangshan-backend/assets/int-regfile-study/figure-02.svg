<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="rf-title-2" width="1120" height="300" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rf-title-2">224개 physical register를 네 bank에 배치</title><defs><marker id="rf-arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><text x="560" y="35" font-size="26" fill="#16394a" font-weight="700" text-anchor="middle">공유 저장소: 224개 physical register × 64-bit</text><g data-box="true"><rect x="12" y="55" width="256" height="94" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="140.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">Bank 0</text><text x="140.0" y="119" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">56 rows × 64-bit</text></g><text x="140" y="187" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">p0, p4, …, p220</text><text x="140" y="223" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">R0–R11: 12 read 채널</text><g data-box="true"><rect x="292" y="55" width="256" height="94" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="420.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">Bank 1</text><text x="420.0" y="119" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">56 rows × 64-bit</text></g><text x="420" y="187" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">p1, p5, …, p221</text><text x="420" y="223" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">R0–R11: 12 read 채널</text><g data-box="true"><rect x="572" y="55" width="256" height="94" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="700.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">Bank 2</text><text x="700.0" y="119" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">56 rows × 64-bit</text></g><text x="700" y="187" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">p2, p6, …, p222</text><text x="700" y="223" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">R0–R11: 12 read 채널</text><g data-box="true"><rect x="852" y="55" width="256" height="94" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="980.0" y="87" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">Bank 3</text><text x="980.0" y="119" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">56 rows × 64-bit</text></g><text x="980" y="187" font-size="23" fill="#16394a" font-weight="400" text-anchor="middle">p3, p7, …, p223</text><text x="980" y="223" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">R0–R11: 12 read 채널</text><text x="560" y="279" font-size="25" fill="#157b85" font-weight="700" text-anchor="middle">예: p29 → bank 1 / row 7</text></svg>
