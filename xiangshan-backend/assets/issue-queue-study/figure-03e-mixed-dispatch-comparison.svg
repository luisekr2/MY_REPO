<text x="30" y="42" class="title">ALU·BJU 혼합: 같은 두 enqueue 입구를 함께 사용한다</text>
<text x="30" y="73" class="small">아래 세 경우는 같은 후보 목록과 수용 조건을 사용한다. 한 선택 상태의 설명용 계산이며 실제 파형이 아니다.</text>
<rect x="30" y="94" width="1180" height="112" rx="8" fill="#eaf2ff" stroke="#a7b9ca"/>
<text x="48" y="124" class="head">ALU 후보 순서: [IQ0, IQ4, IQ2, IQ1, IQ5, IQ3]     BJU 후보 순서: [IQ0, IQ2, IQ1]</text>
<text x="48" y="155" class="body">가정: 각 IQ enqueue 입구 2개 · 모두 ready · ROB 등 나머지 gate 통과</text>
<text x="48" y="184" class="small">그룹별 순번으로 목적지 선택 → IQ별 누적 요청 수 검사 → 첫 차단 지점부터 뒤쪽 lane 대기</text>
<rect x="30" y="230" width="1180" height="300" rx="8" fill="#f4f7fa" stroke="#a7b9ca"/>
<text x="48" y="264" class="head">A · ALU 5개 + BJU 3개</text>
