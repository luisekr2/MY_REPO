<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 305" role="img" aria-labelledby="rc-title-7" width="1120" height="305" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rc-title-7">메모리 head 경계와 ROB retirement를 분리</title><defs><marker id="rc-arrow-7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="10" y="15" width="330" height="85" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="175.0" y="47" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">head E: CC [LD | SD]</text><text x="175.0" y="79" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">former=0 / latter=1</text><path d="M350 57 H390" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-7)"/><rect x="400" y="15" width="310" height="85" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="555.0" y="47" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">pendingPtr → latter</text><text x="555.0" y="79" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">register 경로를 따라 진행</text><path d="M720 57 H770" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-7)"/><rect x="780" y="15" width="325" height="85" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="942.5" y="47" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">VSQ → Physical SQ</text><text x="942.5" y="79" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">exclusive boundary 전달</text><rect x="10" y="155" width="330" height="85" rx="8" fill="#fff0e9" stroke="#bed1d7"/><text x="175.0" y="187" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">scommit=1 가능</text><text x="175.0" y="219" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">store retirement 개수 아님</text><rect x="400" y="155" width="310" height="85" rx="8" fill="#fff0e9" stroke="#bed1d7"/><text x="555.0" y="187" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">SD data 미도착</text><text x="555.0" y="219" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">SQ 배출 불가</text><rect x="780" y="155" width="325" height="85" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="942.5" y="187" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">ROB entry 유지</text><text x="942.5" y="219" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">SD 완료와 commit gate 대기</text><text x="560" y="287" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">boundary + 주소/data + 권한/예외 + 순서 + 배출 ready를 각각 확인</text></svg>
