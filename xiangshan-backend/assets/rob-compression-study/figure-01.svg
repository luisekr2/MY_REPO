<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="rc-title-1" width="1120" height="300" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rc-title-1">여러 명령의 실행은 따로, 순서 관리는 하나의 ROB entry</title><defs><marker id="rc-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="12" y="30" width="280" height="90" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="152.0" y="62" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">ADD · XOR · LD</text><text x="152.0" y="94" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">서로 다른 ISA 명령</text><path d="M302 75 H395" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-1)"/><rect x="405" y="20" width="700" height="110" rx="8" fill="#d9eeee" stroke="#bed1d7"/><text x="755.0" y="52" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">ROB entry E: SC</text><text x="755.0" y="84" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">former [ADD, XOR]  |  latter [LD]</text><rect x="12" y="172" width="340" height="75" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="182.0" y="217.5" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">ADD → p40</text><rect x="390" y="172" width="340" height="75" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="560.0" y="217.5" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">XOR → p41</text><rect x="768" y="172" width="337" height="75" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="936.5" y="217.5" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">LD → p42</text><text x="560" y="280" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">각 실행·destination은 독립적 · ROB 순서/완료 metadata를 함께 저장</text></svg>
