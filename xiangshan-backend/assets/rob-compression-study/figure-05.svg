<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 305" role="img" aria-labelledby="rc-title-5" width="1120" height="305" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rc-title-5">분기 위치에 따른 flushAfter의 다른 보존 경계</title><defs><marker id="rc-arrow-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><text x="10" y="32" font-size="22" fill="#16394a" font-weight="400" text-anchor="start">같은 entry</text><text x="720" y="32" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">분기 오예측 뒤</text><rect x="10" y="52" width="435" height="78" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="227.5" y="99.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">CC [LD | BEQ]</text><path d="M455 91 H555" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-5)"/><rect x="565" y="52" width="535" height="78" rx="8" fill="#d9eeee" stroke="#bed1d7"/><text x="832.5" y="99.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">CC [LD | BEQ] 둘 다 보존</text><rect x="10" y="165" width="435" height="78" rx="8" fill="#edf5f6" stroke="#bed1d7"/><text x="227.5" y="212.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">CS [BEQ | ADD, XOR]</text><path d="M455 204 H555" stroke="#157b85" stroke-width="3" marker-end="url(#rc-arrow-5)"/><rect x="565" y="165" width="535" height="78" rx="8" fill="#fff0e9" stroke="#bed1d7"/><text x="832.5" y="212.0" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">NORMAL [BEQ]만 보존</text><text x="560" y="285" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">flushAfter는 분기 자신을 살리고, 프로그램 순서상 뒤쪽을 제거한다.</text></svg>
