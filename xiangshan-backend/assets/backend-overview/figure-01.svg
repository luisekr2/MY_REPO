<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="be-title-1" style="font-family:'Malgun Gothic','Segoe UI',sans-serif;background:white">
<title id="be-title-1">XSCore 경계와 CtrlBlock 내부 ROB의 등록·완료 경로</title>
<defs><marker id="be-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="230" y="12" width="660" height="550" rx="8" fill="#fff" stroke="#157b85" stroke-width="2"/><text x="560" y="44" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">Backend / inner: BackendInlined</text>
<rect x="250" y="70" width="620" height="250" rx="8" fill="#f3f8f9" stroke="#8ab7be" stroke-width="2"/><text x="560" y="102" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">ctrlBlock: CtrlBlock</text>
<rect x="270" y="125" width="235" height="85" rx="8" fill="#d9eeee" stroke="#bed1d7" stroke-width="2"/><text x="387" y="160" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">Decode → Rename</text><text x="387" y="192" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">→ Dispatch</text>
<rect x="655" y="125" width="195" height="150" rx="8" fill="#fff0e9" stroke="#c78d74" stroke-width="2"/><text x="752" y="160" font-size="26" fill="#16394a" font-weight="700" text-anchor="middle">rob: Rob</text><text x="752" y="198" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">순서·완료 추적</text><text x="752" y="232" font-size="20" fill="#16394a" font-weight="400" text-anchor="middle">순서대로 commit</text>
<path d="M515 168 H645" fill="none" stroke="#157b85" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="580" y="146" font-size="20" fill="#16394a" font-weight="400" text-anchor="middle">등록 요청</text><text x="580" y="201" font-size="19" fill="#16394a" font-weight="400" text-anchor="middle">1단 register</text>
<text x="530" y="251" font-size="19" fill="#157b85" font-weight="700" text-anchor="middle">등록 요청은 1 cycle 뒤</text><text x="530" y="280" font-size="20" fill="#157b85" font-weight="700" text-anchor="middle">ROB 입력에 도착</text>
<rect x="270" y="390" width="580" height="75" rx="8" fill="#d9eeee" stroke="#bed1d7" stroke-width="2"/><text x="560" y="421" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">intRegion: Region</text><text x="560" y="451" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">IQ → operand 공급 → 정수 실행</text>
<path d="M387 210 V380" fill="none" stroke="#157b85" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="450" y="351" font-size="20" fill="#16394a" font-weight="400" text-anchor="middle">IQ로 전달</text>
<path d="M752 380 V285" fill="none" stroke="#b45635" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="797" y="351" font-size="20" fill="#b45635" font-weight="400" text-anchor="middle">WB 완료</text>
<rect x="270" y="495" width="280" height="47" rx="8" fill="#f1f3f5" stroke="#bed1d7" stroke-width="2"/><text x="410" y="526" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">fpRegion</text>
<rect x="570" y="495" width="280" height="47" rx="8" fill="#f1f3f5" stroke="#bed1d7" stroke-width="2"/><text x="710" y="526" font-size="22" fill="#16394a" font-weight="700" text-anchor="middle">vecRegion</text>
<rect x="10" y="125" width="165" height="150" rx="8" fill="#edf5f6" stroke="#bed1d7" stroke-width="2"/><text x="92" y="165" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">Frontend</text><text x="92" y="202" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">명령·PC</text>
<path d="M175 155 H260" fill="none" stroke="#157b85" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="217" y="137" font-size="18" fill="#16394a" font-weight="400" text-anchor="middle">명령</text>
<path d="M230 244 H185" fill="none" stroke="#b45635" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#be-arrow-1)"/><text x="207" y="275" font-size="18" fill="#b45635" font-weight="400" text-anchor="middle">복구</text>
<rect x="945" y="390" width="165" height="100" rx="8" fill="#edf5f6" stroke="#bed1d7" stroke-width="2"/><text x="1027" y="423" font-size="24" fill="#16394a" font-weight="700" text-anchor="middle">MemBlock</text><text x="1027" y="457" font-size="19" fill="#16394a" font-weight="400" text-anchor="middle">LSQ · LD/ST</text>
<path d="M860 410 H935" fill="none" stroke="#157b85" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="909" y="395" font-size="18" fill="#16394a" font-weight="400" text-anchor="middle">발행</text>
<path d="M935 451 H900" fill="none" stroke="#157b85" stroke-width="3"  marker-end="url(#be-arrow-1)"/><text x="916" y="480" font-size="18" fill="#16394a" font-weight="400" text-anchor="middle">결과</text>
<text x="560" y="590" font-size="20" fill="#16394a" font-weight="400" text-anchor="middle">기능 경로 요약 · 메모리 writeback / 세부 복구·보조 블록 배선 생략</text>
</svg>
