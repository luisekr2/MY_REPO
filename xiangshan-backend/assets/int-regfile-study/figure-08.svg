<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 345" role="img" aria-labelledby="rf-title-8" width="1120" height="345" style="font-family:&quot;Malgun Gothic&quot;, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title id="rf-title-8">아홉 global write 입력과 동일 bank의 서로 다른 row 갱신</title><defs><marker id="rf-arrow-8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><text x="560" y="30" font-size="26" fill="#16394a" font-weight="700" text-anchor="middle">전체 PRF가 받는 write 입력: W0–W8, 총 9개</text><rect x="10" y="75" width="240" height="175" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="130" y="110" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">예: ALU0 / 1 / 3</text><text x="130" y="155" font-size="22" fill="#16394a" font-weight="400" text-anchor="middle">서로 다른 결과 3개</text><text x="130" y="205" font-size="21" fill="#16394a" font-weight="400" text-anchor="middle">동시에 도착한다고 가정</text><g data-box="true"><rect x="385" y="75" width="240" height="48" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="505.0" y="107.0" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">W0 → p29</text></g><g data-box="true"><rect x="385" y="142" width="240" height="48" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="505.0" y="174.0" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">W1 → p33</text></g><g data-box="true"><rect x="385" y="209" width="240" height="48" rx="9" fill="#edf5f6" stroke="#bed1d7"/><text x="505.0" y="241.0" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">W3 → p45</text></g><path d="M260 110 H325 V99 H375" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><path d="M260 163 H375" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><path d="M260 220 H325 V233 H375" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><rect x="790" y="60" width="315" height="218" rx="9" fill="#d9eeee" stroke="#bed1d7"/><text x="947" y="93" font-size="25" fill="#16394a" font-weight="700" text-anchor="middle">Bank 1의 row 선택</text><text x="947" y="137" font-size="24" fill="#16394a" font-weight="400" text-anchor="middle">row 7 ← p29</text><text x="947" y="190" font-size="24" fill="#16394a" font-weight="400" text-anchor="middle">row 8 ← p33</text><text x="947" y="243" font-size="24" fill="#16394a" font-weight="400" text-anchor="middle">row 11 ← p45</text><path d="M635 99 H735 V128 H780" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><path d="M635 166 H735 V181 H780" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><path d="M635 233 H780" fill="none" stroke="#157b85" stroke-width="3" marker-end="url(#rf-arrow-8)"/><text x="560" y="325" font-size="23" fill="#157b85" font-weight="700" text-anchor="middle">write 입력은 full pdest로 row를 선택 · W3는 Bank 3 전용이 아님</text></svg>
